name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Next static export)
        run: pnpm build

      - name: Assemble dist (Next root + /proximamente)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          # Evita que Jekyll rompa carpetas tipo _next
          touch dist/.nojekyll

          # Dominio personalizado
          if [ -f CNAME ]; then cp -f CNAME dist/CNAME; fi

          # Next export → raíz del sitio (tonaltlan.com)
          cp -R out/* dist/

          # Landing legacy → /proximamente
          mkdir -p dist/proximamente
          cp -f index.html dist/proximamente/index.html
          for f in piramides_azteca_final.png produccion.png tonaltlan_logo.png; do
            if [ -f "$f" ]; then cp -f "$f" "dist/proximamente/$f"; fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

